<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Language Roleplay</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; background: #f4f4f9; }
        .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 1rem; }
        h1 { margin-top: 0; font-size: 1.5rem; color: #333; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        #chat-box { height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 6px; background: #fafafa; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .message { max-width: 80%; padding: 10px; border-radius: 8px; line-height: 1.4; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .ai-msg { background: #e9ecef; color: black; align-self: flex-start; border-bottom-left-radius: 0; }
        .system-msg { background: #fff3cd; color: #856404; align-self: center; text-align: center; font-size: 0.85rem; width: 100%; }
        .controls { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #mic-btn { background: #ff4757; color: white; }
        #mic-btn.recording { background: #ff6b81; animation: pulse 1s infinite; }
        #send-btn { background: #2ed573; color: white; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="card">
        <h1>🗣️ Language Scenario Trainer</h1>
        <input type="password" id="api-key" placeholder="Enter Gemini API Key..." />
        
        <label>Choose a Scenario:</label>
        <select id="scenario-select">
            <option value="bangkok">🇹🇭 Bangkok Street Food (Order Pork & Sticky Rice)</option>
            <option value="tokyo">🇯🇵 Tokyo 7-11 (Order Hot Coffee)</option>
        </select>
        <button id="start-btn" style="background: #1e90ff; color: white; width: 100%; margin-bottom: 10px;">Start Scenario</button>
    </div>

    <div class="card">
        <div id="chat-box">
            <div class="message system-msg">Select a scenario and click Start.</div>
        </div>
        
        <div class="controls">
            <input type="text" id="text-input" placeholder="Type or use mic..." style="margin: 0; flex: 2;" />
            <button id="mic-btn">🎤 Mic</button>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const textInput = document.getElementById('text-input');
        const micBtn = document.getElementById('mic-btn');
        const sendBtn = document.getElementById('send-btn');
        const startBtn = document.getElementById('start-btn');
        
        let conversationHistory = [];
        let recognition;
        let currentLanguage = 'th-TH'; // Default Thai

        // Scenarios definition
        const scenarios = {
            bangkok: {
                lang: 'th-TH',
                voiceLang: 'th-TH',
                prompt: `You are a street food vendor in Bangkok, Thailand. The user needs to practice Thai by ordering Grilled Pork (Moo Ping) and Sticky Rice (Khao Niao). 
                Rules:
                1. Only speak in Thai. Keep it brief and natural to a street vendor.
                2. Do not provide English translations. 
                3. If the user successfully asks for BOTH Grilled Pork and Sticky Rice, reply with the food, the price, and end your message with exactly "[SUCCESS]".`
            },
            tokyo: {
                lang: 'ja-JP',
                voiceLang: 'ja-JP',
                prompt: `You are a cashier at a 7-11 in Tokyo, Japan. The user needs to practice Japanese by asking to buy a hot coffee.
                Rules:
                1. Only speak in Japanese. Keep it brief and polite (Keigo).
                2. Do not provide English translations.
                3. If the user successfully asks for a hot coffee, reply by handing it over, stating the price, and end your message with exactly "[SUCCESS]".`
            }
        };

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => micBtn.classList.add('recording');
            recognition.onend = () => micBtn.classList.remove('recording');
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript;
                sendMessage();
            };
        } else {
            micBtn.disabled = true;
            micBtn.innerText = "Mic Not Supported";
        }

        micBtn.addEventListener('mousedown', () => {
            if (recognition) {
                recognition.lang = currentLanguage;
                recognition.start();
            }
        });

        startBtn.addEventListener('click', () => {
            const scenarioKey = document.getElementById('scenario-select').value;
            const scenario = scenarios[scenarioKey];
            currentLanguage = scenario.lang;
            
            conversationHistory = [{
                role: 'user', 
                parts: [{ text: scenario.prompt }]
            }, {
                role: 'model',
                parts: [{ text: "Understood. I am in character. You can speak to me now." }]
            }];

            chatBox.innerHTML = '';
            addMessage(`Started: ${scenarioKey === 'bangkok' ? 'Bangkok Food Stall' : 'Tokyo 7-11'}. You can speak now!`, 'system-msg');
        });

        async function sendMessage() {
            const text = textInput.value.trim();
            const apiKey = document.getElementById('api-key').value;
            
            if (!text || !apiKey) {
                alert("Please enter a message and your API Key.");
                return;
            }

            addMessage(text, 'user-msg');
            textInput.value = '';
            
            conversationHistory.push({ role: 'user', parts: [{ text: text }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });
                
                const data = await response.json();
                let aiText = data.candidates[0].content.parts[0].text;
                
                conversationHistory.push({ role: 'model', parts: [{ text: aiText }] });
                
                // Check win condition
                if (aiText.includes("[SUCCESS]")) {
                    aiText = aiText.replace("[SUCCESS]", "");
                    addMessage(aiText, 'ai-msg');
                    speakText(aiText);
                    setTimeout(() => addMessage("🎉 SCENARIO COMPLETE! Great job!", 'system-msg'), 1000);
                } else {
                    addMessage(aiText, 'ai-msg');
                    speakText(aiText);
                }

            } catch (error) {
                addMessage("Error connecting to Gemini.", 'system-msg');
                console.error(error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        textInput.addEventListener('keypress', (e) => e.key === 'Enter' ? sendMessage() : null);

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speakText(text) {
            const scenarioKey = document.getElementById('scenario-select').value;
            const lang = scenarios[scenarioKey].voiceLang;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            
            // Try to pick a native voice if available
            const voices = window.speechSynthesis.getVoices();
            const nativeVoice = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (nativeVoice) utterance.voice = nativeVoice;
            
            window.speechSynthesis.speak(utterance);
        }
        
        // Load voices early
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    </script>
</body>
</html>
